<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>PacMan</title><meta name="description" content="A full-screen maze arcade game."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M27 8A13 13 0 1 0 27 24L16 16Z' fill='%23ffeb00'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body><main>
<canvas id="maze" width="570" height="630" tabindex="0" aria-label="Maze arcade game. Arrow keys or WASD move. P pauses."></canvas>
<div class="hud"><div class="scores"><span>Score <strong id="score">0</strong></span><span>Best <strong id="best">0</strong></span></div><span id="lives" class="lives" aria-label="3 lives remaining">● ● ●</span><div class="hud-buttons"><button id="pause" class="small-button" disabled>Pause</button><button id="fullscreen" class="small-button" aria-label="Enter fullscreen">⛶</button></div></div>
<div id="overlay" class="overlay"><div class="overlay-content"><h2 id="state" hidden></h2><button id="play" class="primary">Play</button><button id="restart" class="small-button" hidden>Restart</button></div></div>
<div class="touch-controls" aria-label="Movement controls"><button data-direction="up" aria-label="Move up">▲</button><button data-direction="left" aria-label="Move left">◀</button><button data-direction="down" aria-label="Move down">▼</button><button data-direction="right" aria-label="Move right">▶</button></div>
<p class="sr-only" id="announcement" role="status" aria-live="polite"></p></main><noscript>Please enable JavaScript to play.</noscript></body></html>
